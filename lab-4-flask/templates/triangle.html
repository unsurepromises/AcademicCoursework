<!DOCTYPE html>
<html>
<head>
    <title>Area of Triangle</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav class="navbar">
        <a href="/">Home</a>
        <a href="/profile">Profile</a>
        <a href="/works">Works</a>
        <a href="/contact">Contact</a>
    </nav>

    <main>
        <h1>Area of Triangle</h1>

        <form action="/works/area/triangle" method="post">
            <label for="base">Enter base:</label>
            <input type="number" step="any" id="base" name="base" required>

            <label for="height">Enter height:</label>
            <input type="number" step="any" id="height" name="height" required>

            <input type="submit" value="Compute">
        </form>

        {% if result %}
        <p class="result">Area of the triangle: {{ result }}</p>
        {% endif %}
    </main>
</body>
</html>
