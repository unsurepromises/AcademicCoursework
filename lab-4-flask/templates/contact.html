<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <nav class="navbar">
        <a href="/">Home</a>
        <a href="/profile">Profile</a>
        <a href="/works">Works</a>
        <a href="/contact">Contact</a>
    </nav>

    <main class="spec-container">
        <!-- Contact Spec Card -->
        <section class="spec-card">
            <div class="spec-header">
                <div class="spec-avatar contact-avatar">
                    <span>✉</span>
                </div>
                <div>
                    <h1 class="spec-title">Contact Me</h1>
                    <p class="spec-subtitle">Feel free to reach out through any of the channels below:</p>
                </div>
            </div>

            <!-- Clickable Utility Cards (Interface Elements) -->
            <div class="contact-channels">
                <a href="mailto:sjohnreimarc@gmail.com" class="channel-card">
                    <div class="channel-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                            <polyline points="22,6 12,13 2,6"></polyline>
                        </svg>
                    </div>
                    <div class="channel-content">
                        <span class="channel-label">Email</span>
                        <span class="channel-value">sjohnreimarc@gmail.com</span>
                    </div>
                    <span class="channel-action">Send Email &rarr;</span>
                </a>

                <a href="https://github.com/UnsurePromises" target="_blank" rel="noopener noreferrer" class="channel-card">
                    <div class="channel-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
                        </svg>
                    </div>
                    <div class="channel-content">
                        <span class="channel-label">GitHub</span>
                        <span class="channel-value">github.com/UnsurePromises</span>
                    </div>
                    <span class="channel-action">View Profile &rarr;</span>
                </a>
            </div>
        </section>
    </main>
</body>
</html>
